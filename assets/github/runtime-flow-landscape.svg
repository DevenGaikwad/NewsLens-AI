<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">NewsLens AI runtime architecture</title><desc id="desc">Validated input branches into independent extractive summarisation and synthetic Reference comparison. The latter uses visible fields, a TF-IDF Logistic Regression model, bound Platt calibration, scope review and local explanation. Results support human review, exports, a session-isolated archive and privacy-safe aggregates. Training and evaluation are offline only.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6D5947"/></marker></defs>
