">Selected-length reading view</text><rect x="640" y="260" width="510" height="185" rx="14" fill="#FAF8F2" stroke="#6D5947" stroke-width="2"/><text x="666" y="303" fill="#1A1917" font-family="Georgia, Times New Roman, serif" font-size="25" font-weight="700" text-anchor="start">B · Reference comparison</text><text x="666" y="341" fill="#1A1917" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Visible field signals → synthetic linear model</text><text x="666" y="377" fill="#1A1917" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Bound Platt calibration → review policy</text><text x="666" y="413" fill="#1A1917" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Local explanation only when supported</text><polyline points="307,210 307,260" fill="none" stroke="#6D5947" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="895,210 895,260" fill="none" stroke="#6D5947" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="52" y="485" width="735" height="92" rx="14" fill="#EAE4D8" stroke="#6D5947" stroke-width="2"/><text x="78" y="517" fill="#1A1917" font-family="Georgia, Times New Roman, serif" font-size="23" font-weight="700" text-anchor="start">Editorial result and session-isolated archive</text><text x="78" y="544" fill="#1A1917" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Fields agree/conflict or review · JSON/PDF/CSV</text><text x="78" y="569" fill="#1A1917" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Privacy-safe aggregate analytics</text><polyline points="307,445 307,485" fill="none" stroke="#6D5947" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="895,445 895,466 705,466 705,485" fill="none" stroke="#6D5947" stroke-width="3" stroke-linejo