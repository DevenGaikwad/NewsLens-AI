<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">NewsLens AI bounded decision workflow</title><desc id="desc">Validate and safely extract article input. Produce an independent summary. Check for two complete unambiguous fictional field blocks. Compare the visible fields with a synthetic linear model and bound Platt calibration. A supported outcome can say fields agree or conflict; missing, ambiguous, or discordant input is withheld for editorial review. Results are exportable and session-local.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6D5947"/></marker></defs>
<rect x="1" y="1" width="1198" height="588" rx="20" fill="#F3F0E8" stroke="#D4CEC2" stroke-width="2"/>
<text x="52" y="62" fill="#1A1917" font-family="Georgia, Times New Roman, serif" font-size="36" font-weight="700" text-anchor="start">Application decision workflow</text><text x="52" y="94" fill="#6D5947" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">A score is shown only within the supported comparison format</text><rect x="52" y="134" width="330" height="105" rx="14" fill="#FAF8F2" stroke="#D4CEC2" stroke-width="2"/><text x="75" y="177" fill="#1A1917" font-family="Georgia, Times New Roman, serif" font-size="23" font-weight="700" text-anchor="start">1 · Validate input</text><text x="75" y="210" fill="#1A1917" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Safe extract and clean article</text><rect x="435" y="134" width="330" height="105" rx="14" fill="#FAF8F2" stroke="#D4CEC2" stroke-width="2"/><text x="458" y="177" fill="#1A1917" font-family="Georgia, Times New Roman, serif" font-size="23" font-weight="700" text-anchor="start">2 · Summarise</text><text x="458" y="210" fill="#1A1917" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Independent reading view</text><rect x="818" y="134" width="330" height="105" rx="14" fill="#FAF8F2" stroke="#D4CEC2" stroke-width="2"/><text x="841" y="177" fill="#1A1917" font-family="Georgia, Times New Roman, serif" font-size="23" font-weight="700" text-anchor="start">3 · Check scope</text><text x="841" y="210" fill="#1A1917" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Both complete field blocks?</text><rect x="52" y="306" width="330" height="105" rx="14" fill="#FAF8F2" stroke="#D4CEC2" stroke-width="2"/><text x="75" y="349" fill="#1A1917" font-family="Georgia, Times New Roman, serif" font-size="23" font-weight="700" text-anchor="start">4 · Compare fields</text><text x="75" y="382" fill="#1A1917" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Synthetic linear classifier</text><rect x="435" y="306" width="330" height="105" rx="14" fill="#FAF8F2" stroke="#D4CEC2" stroke-width="2"/><text x="458" y="349" fill="#1A1917" font-family="Georgia, Times New Roman, serif" font-size="23" font-weight="700" text-anchor="start">5 · Calibrate</text><text x="458" y="382" fill="#1A1917" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Bound Platt score and guard</text><rect x="818" y="306" width="330" height="105" rx="14" fill="#FAF8F2" stroke="#D4CEC2" stroke-width="2"/><text x="841" y="349" fill="#1A1917" font-family="Georgia, Times New Roman, serif" font-size="23" font-weight="700" text-anchor="start">6 · Editorial outcome</text><text x="841" y="382" fill="#1A1917" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Agree / conflict / review</text><polyline points="382,185 435,185" fill="none" stroke="#6D5947" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="765,185 818,185" fill="none" stroke="#6D5947" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="983,239 983,266 217,266 217,306" fill="none" stroke="#6D5947" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="382,357 435,357" fill="none" stroke="#6D5947" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="765,357 818,357" fill="none" stroke="#6D5947" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="52" y="463" width="1096" height="90" rx="14" fill="#EAE4D8" stroke="#6D5947" stroke-width="2"/><text x="82" y="501" fill="#1A1917" font-family="Georgia, Times New Roman, serif" font-size="23" font-weight="700" text-anchor="start">Review and result delivery</text><text x="82" y="532" fill="#1A1917" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">Unsupported or ambiguous → score withheld; human review, exports, session-local archive.</text><polyline points="983,411 983,463" fill="none" stroke="#6D5947" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1148,185 1170,185 1170,447 1090,447 1090,463" fill="none" stroke="#6D5947" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
</svg>
