<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">NewsLens AI locked-test and challenge confusion matrices</title><desc id="desc">Side-by-side synthetic matrices with actual rows and predicted columns, class order agree then conflict. Locked final test on 1,200 in-distribution rows: 600 agreements and 600 conflicts correct. Unfamiliar Phase 5W challenge on 44 structured cases: 22 agreements correct, 22 conflicts incorrectly predicted as agreements. Public automatic decisions cover only 14 of those 44; remaining cases are sent to review. This is not real-world news validation.</desc>
