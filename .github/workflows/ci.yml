name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-lite.txt
      - name: Compile Python sources
        run: python -m compileall -q app.py pages src ui tests scripts training
      - name: Verify public synthetic model and calibration binding
        run: |
          if test -f models/fake_news_pipeline.joblib || test -f models/confidence_calibration.json; then
            echo "::error title=Private artifact detected::Historical private classifier artifacts must remain excluded."
            exit 1
          fi
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('.')
          manifest = json.loads((root / 'models/public_artifact_manifest.json').read_text())
          calibration = json.loads((root / 'models/newslens_synthetic_calibration.json').read_text())
          model = root / manifest['artifacts']['model']['path']
          actual = hashlib.sha256(model.read_bytes()).hexdigest()
          expected = manifest['artifacts']['model']['sha256']
          assert actual == expected == calibration['model_sha256']
          assert manifest['synthetic_only'] is True
          PY
      - name: Run complete Python test suite
        run: python -m pytest -q --strict-markers --junitxml=reports/results/pytest_results.xml

  public-release-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan committed public tree and verify artifact identities
        run: python scripts/audit_public_release.py --tracked-files

  presentation-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_STREAMLIT_APP_URL: https://newslens-ai-devengaikwad.streamlit.app/

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
