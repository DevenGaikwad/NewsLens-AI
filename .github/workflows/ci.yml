name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-lite.txt
      - name: Compile Python sources
        run: python -m compileall -q app.py pages src ui tests scripts training
      - name: Confirm private classifier artifacts are excluded
        run: |
          if test -f models/fake_news_pipeline.joblib || test -f models/confidence_calibration.json; then
            echo "::error title=Private artifact detected::The public repository must exclude the classifier and private calibration artifacts."
            exit 1
          fi
          echo "::notice title=Private classifier gate::The public repository intentionally excludes the classifier and private calibration. Functional classifier tests require the owner's private local artifacts."
          {
            echo "### Private classifier gate"
            echo
            echo "The public repository intentionally excludes the packaged classifier and private calibration."
            echo "Model-independent tests run below; four private-artifact tests remain explicitly deselected until redistribution rights are resolved."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run model-independent Python tests
        run: python -m pytest -q --strict-markers -m "not private_model"
      - name: Report private-artifact test gate
        run: |
          echo "::notice title=Private-artifact tests unavailable::Classifier loading, calibrated inference, and model-bound diagnostics require the owner's private local artifacts and were not run in this public workflow."

  public-release-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan committed public tree while retaining documented publication gates
        run: python scripts/audit_public_release.py --tracked-files --allow-publication-gates

  presentation-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_STREAMLIT_APP_URL: https://YOUR-APP.streamlit.app

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
