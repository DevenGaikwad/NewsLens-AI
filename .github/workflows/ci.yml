name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-lite.txt
      - name: Compile Python sources
        run: python -m compileall -q app.py pages src ui tests scripts training
      - name: Confirm packaged classifier is available
        run: |
          test -f models/fake_news_pipeline.joblib || {
            echo "The public-staging repository intentionally excludes the classifier. CI remains blocked until redistribution rights are resolved."
            exit 1
          }
      - run: python -m pytest -q

  public-release-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan staged tree while retaining documented publication gates
        run: python scripts/audit_public_release.py --allow-publication-gates

  presentation-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_STREAMLIT_APP_URL: https://YOUR-APP.streamlit.app

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
